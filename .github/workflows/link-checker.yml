name: Link Checker

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
  pull_request:
    branches: [main, master]
    paths:
      - "**.md"
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The two --exclude patterns cover artifacts generated by the
          # snake/metrics/scorecard workflows, which 404 until each has run once
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-path .github
            --exclude "raw.githubusercontent.com/dhivagar29/dhivagar29"
            --exclude "api.scorecard.dev"
            --no-fail-on-warnings
            "**/*.md"
          fail: true
