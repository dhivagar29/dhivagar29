name: Link Checker

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
  pull_request:
    branches: [main, master]
    paths:
      - "**.md"
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore lychee cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # The two --exclude patterns cover artifacts generated by the
          # snake/metrics/scorecard workflows, which 404 until each has run once
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-path .github
            --exclude "raw.githubusercontent.com/dhivagar29/dhivagar29"
            --exclude "api.scorecard.dev"
            --no-fail-on-warnings
            "**/*.md"
          fail: true
