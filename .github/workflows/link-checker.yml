name: Link Checker

on:
  push:
    branches: [main, master]
    paths:
      - "**.md"
  pull_request:
    branches: [main, master]
    paths:
      - "**.md"
      - ".github/workflows/link-checker.yml"
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check for Broken Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Generated widgets 404 until their workflows run; github-readme-stats
          # 503s often enough to flake CI. --no-fail-on-warnings was removed in
          # lychee 0.23 and was aborting this job before any links were checked.
          args: >-
            --cache
            --max-cache-age 1d
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude-path .github
            --exclude "raw.githubusercontent.com/dhivagar29/dhivagar29"
            --exclude "api.scorecard.dev"
            --exclude "github-readme-stats.vercel.app"
            "**/*.md"
          fail: true
